<h2 mat-dialog-title>สร้างแบบประเมิน</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form" id="survey-form" (ngSubmit)="save()">
    <mat-form-field appearance="outline" class="full">
      <mat-label>ชื่อแบบประเมิน</mat-label>
      <input matInput formControlName="title" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full">
      <mat-label>คำอธิบาย</mat-label>
      <textarea matInput rows="2" formControlName="description"></textarea>
    </mat-form-field>

    <div class="q-head">
      <h3>คำถาม</h3>
      <button mat-stroked-button type="button" (click)="addQuestion()">
        <mat-icon>add</mat-icon>
        เพิ่มคำถาม
      </button>
    </div>

    <div formArrayName="questions" class="q-list">
      @for (ctrl of questions.controls; track $index; let i = $index) {
        <div class="q-item" [formGroupName]="i">
          <mat-form-field appearance="outline" class="full">
            <mat-label>ข้อความคำถาม</mat-label>
            <input matInput formControlName="questionText" />
          </mat-form-field>
          <div class="row">
            <mat-form-field appearance="outline">
              <mat-label>ประเภท</mat-label>
              <mat-select formControlName="questionType">
                @for (t of types; track t) {
                  <mat-option [value]="t">{{ typeLabels[t] }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
            @if (needsOptions(ctrl.get('questionType')?.value)) {
              <mat-form-field appearance="outline">
                <mat-label>ตัวเลือก (คั่นด้วย ,)</mat-label>
                <input matInput formControlName="optionsText" placeholder="ดี, พอใช้, ปรับปรุง" />
              </mat-form-field>
            }
          </div>
          <button mat-button type="button" color="warn" (click)="removeQuestion(i)" [disabled]="questions.length <= 1">
            ลบคำถาม
          </button>
        </div>
      }
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>ยกเลิก</button>
  <button mat-flat-button color="primary" type="submit" form="survey-form" [disabled]="saving()">
    บันทึก
  </button>
</mat-dialog-actions>
