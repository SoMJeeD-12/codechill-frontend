<h2 mat-dialog-title>{{ isEdit ? 'แก้ไขลูกค้า' : 'เพิ่มลูกค้า' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form">
    <mat-form-field appearance="outline" class="full">
      <mat-label>ชื่อลูกค้า</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>
    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>เลขผู้เสียภาษี</mat-label>
        <input matInput formControlName="taxId" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>ประเภทธุรกิจ</mat-label>
        <input matInput formControlName="businessType" />
      </mat-form-field>
    </div>
    <mat-form-field appearance="outline" class="full">
      <mat-label>ที่อยู่</mat-label>
      <textarea matInput rows="2" formControlName="address"></textarea>
    </mat-form-field>
    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>สถานะ</mat-label>
        <mat-select formControlName="status">
          @for (s of statuses; track s) {
            <mat-option [value]="s">{{ statusLabels[s] }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>มูลค่ารวม (บาท)</mat-label>
        <input matInput type="number" formControlName="lifetimeValue" />
      </mat-form-field>
    </div>
  </form>
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>ยกเลิก</button>
  <button mat-flat-button color="primary" type="button" [disabled]="saving()" (click)="save()">
    บันทึก
  </button>
</mat-dialog-actions>
