<h2 mat-dialog-title>อัปโหลดเอกสาร</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form" id="doc-upload-form" (ngSubmit)="save()">
    <app-entity-picker
      class="full"
      label="โปรเจกต์"
      placeholder="พิมพ์รหัสหรือชื่อโปรเจกต์"
      [openOnFocus]="true"
      [searchFn]="searchProjects"
      [selected]="project()"
      (selectionChange)="onProjectPicked($event)"
    />

    <mat-form-field appearance="outline" class="full">
      <mat-label>ชื่อเอกสาร</mat-label>
      <input matInput formControlName="title" />
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>ประเภท</mat-label>
        <mat-select formControlName="category">
          @for (c of categories; track c) {
            <mat-option [value]="c">{{ categoryLabels[c] }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>เวอร์ชัน</mat-label>
        <input matInput formControlName="version" />
      </mat-form-field>
    </div>

    <app-file-picker
      label="เลือกไฟล์"
      hint="เก็บในเครื่องได้ไม่เกิน 1.5MB เพื่อเปิดดูได้"
      [fileName]="form.controls.fileName.value"
      (picked)="onFilePicked($event)"
    />

    <mat-form-field appearance="outline" class="full">
      <mat-label>ชื่อไฟล์</mat-label>
      <input matInput formControlName="fileName" placeholder="เช่น contract-v1.pdf" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>หมายเหตุ</mat-label>
      <textarea matInput rows="2" formControlName="note"></textarea>
    </mat-form-field>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>ยกเลิก</button>
  <button mat-flat-button color="primary" type="submit" form="doc-upload-form" [disabled]="saving()">
    บันทึก
  </button>
</mat-dialog-actions>
